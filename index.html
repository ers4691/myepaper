<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 18px;
        }
        .container {
            padding: 15px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .info-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <a class="weatherwidget-io" href="https://forecast7.com/de/48d1411d58/munich/" data-label_1="München" data-label_2="Wetter" data-days="3" data-theme="pure" >München Wetter</a>
    <script>
        !function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(!d.getElementById(id)){js=d.createElement(s);js.id=id;js.src='https://weatherwidget.io/js/widget.min.js';fjs.parentNode.insertBefore(js,fjs);}}(document,'script','weatherwidget-io-js');
    </script>

<div id="fblwidget_teammatches"></div>
<script src="//bundesliga-widgets.de/js/teammatches.js" type="text/javascript"></script>
<script type="text/javascript">
  var fblWidgetSettings = {

    // der Lieblingsverein,
    // das Team, dessen Spiele in das TeamMatches-Widgets geladen werden:
    teamMatchesTeam: 'FC Kaiserslautern',
    
    weekCountPast: 5,  // wieviele Wochen rückwirkend sollen die Spiele angezeigt werden?
    weekCountFuture: 3, // wieviele Wochen vorrausschauend sollen die Spiele angezeigt werden?


    // hebt in allen Widgets die Teamnamen hervor:
    teamsToHighlight: ['FC Bayern München', 'Hamburg'],

    // generiert aus den angegebenen Teams Links zu der angegebenen Url:
    teamLinks: [{
      'teamname': 'Bayern',
      'link': 'https://fcbayern.com/de'
    }, {
      'teamname': 'Dortmund',
      'link': 'https://www.bvb.de/'
    }]
  };
</script>
</body>
</html>
